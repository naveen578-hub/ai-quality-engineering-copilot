name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run test suite
        env:
          # Force mock mode so CI never needs (or accidentally uses) a real
          # API key or incurs real cost — this mirrors every test file's own
          # `os.environ.pop("OPENAI_API_KEY", None)` guard, belt-and-suspenders.
          QE_COPILOT_JWT_SECRET: ci-test-secret-not-for-prod
          # Force the mock embedding tier specifically (not just "no API key"):
          # without this, a fresh CI runner with no OPENAI_API_KEY would fall
          # through to the local ONNX model tier and try to download it
          # (~80MB) on every cold run — slow and a network dependency CI
          # shouldn't have. See backend/rag/embeddings.py module docstring.
          QE_COPILOT_EMBEDDING_MODE: mock
        run: |
          unset OPENAI_API_KEY
          PYTHONPATH=. python -m pytest backend/tests -v

      - name: Run RAG evaluation harness
        env:
          QE_COPILOT_JWT_SECRET: ci-test-secret-not-for-prod
          QE_COPILOT_EMBEDDING_MODE: mock
        run: |
          unset OPENAI_API_KEY
          PYTHONPATH=. python evaluation/run_rag_eval.py

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  # Runs only if both the backend and frontend jobs above build/test cleanly on
  # a real, tracked base image — a lighter-weight substitute for actually
  # building and smoke-testing the Docker images in CI (left as a follow-up;
  # see README "Docker" section for exactly what has and hasn't been verified).
  docker-config-check:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml syntax
        run: |
          pip install pyyaml
          python3 -c "
          import yaml
          with open('docker-compose.yml') as f:
              doc = yaml.safe_load(f)
          assert 'backend' in doc['services']
          assert 'frontend' in doc['services']
          print('docker-compose.yml is valid YAML with expected services.')
          "
